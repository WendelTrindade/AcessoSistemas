<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guardião - Serviços de Qualidade</title>

  <!-- PWA / Mobile Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0c">

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.85);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #f7e7ad 0%, #c5a059 50%, #8a6d2b 100%);
      --border-card: rgba(212, 175, 55, 0.3);
      --border-hover: rgba(212, 175, 55, 0.9);
      --text-white: #ffffff;
      --text-muted: #9a9a9e;
      --green-status: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    /* Botão de Configuração */
    .admin-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-card);
      color: var(--gold-primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .admin-btn:active {
      transform: rotate(90deg) scale(0.9);
      border-color: var(--gold-primary);
    }

    /* Topo / Logo */
    header {
      text-align: center;
      margin-top: 15px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo-container {
      width: 100%;
      max-width: 230px;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.9));
    }

    /* Lista de Cards */
    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 20px 0;
      animation: fadeInUp 0.8s ease-out;
    }

    /* Design do Card */
    .system-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-white);
      border: 1px solid var(--border-card);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
      cursor: pointer;
    }

    .system-card:active {
      transform: scale(0.97);
      border-color: var(--border-hover);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }

    /* Banner/Logo dentro do Card */
    .card-banner {
      width: 100%;
      height: 160px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px;
    }

    .card-banner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
    }

    .system-card:active .card-banner img {
      transform: scale(1.03);
    }

    /* Badge Status */
    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 2;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--green-status);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-status);
    }

    /* Conteúdo Inferior do Card */
    .card-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    .card-tag {
      font-size: 0.65rem;
      color: var(--gold-primary);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.3;
    }

    /* Rodapé com Link */
    footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
    }

    footer a {
      color: var(--gold-primary);
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    footer a:hover {
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    /* Modal Admin */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal-content {
      background: #121215;
      border: 1px solid var(--border-card);
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      color: var(--text-white);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .modal-header h2 {
      color: var(--gold-primary);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-white);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px;
      border-radius: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--gold-primary);
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      background: #0a0a0c;
      border: 1px solid #282828;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--gold-primary);
    }

    .save-btn {
      width: 100%;
      background: var(--gold-gradient);
      color: #000;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
  </style>
</head>
<body>

  <button class="admin-btn" onclick="openAdmin()" title="Painel Admin">⚙️</button>

  <header>
    <div class="logo-container">
      <img id="main-logo" src="logo.png" alt="Guardião" onerror="this.src='https://via.placeholder.com/230x120/0a0a0c/D4AF37?text=GUARDI%C3%83O'">
    </div>
  </header>

  <main class="app-container" id="buttons-container">
    <!-- Cards renderizados via JS -->
  </main>

  <footer>
    <a href="https://guardiaoseg.com.br/" target="_blank">Guardião &copy; Serviços de Qualidade</a>
  </footer>

  <!-- Modal Admin -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Painel Administrativo</h2>
        <button class="close-btn" onclick="closeAdmin()">✕</button>
      </div>
      <form id="admin-form">
        <div class="form-group">
          <label>URL da Logo Principal</label>
          <input type="text" id="logo-url-input" placeholder="logo.png ou URL da imagem">
        </div>
        <div id="inputs-container"></div>
        <button type="submit" class="save-btn">SALVAR ALTERAÇÕES</button>
      </form>
    </div>
  </div>

  <script>
    const defaultLogo = "logo.png";
    const defaultData = [
      {
        id: 1,
        tag: "Plataforma",
        title: "APP - Guardião Relatórios Plantões",
        url: "https://wendeltrindade.github.io/RondaMaster/",
        icon: "https://i.postimg.cc/kgNgt9Fm/Whats-App-Image-2026-07-22-at-14-11-34.jpg"
      },
      {
        id: 2,
        tag: "Plataforma",
        title: "APP - Guardião Relatório por Imagens",
        url: "https://wendeltrindade.github.io/RelatorioImagens/",
        icon: "https://i.postimg.cc/MHwsH7WT/Whats-App-Image-2026-07-22-at-14-05-37.jpg"
      },
      {
        id: 3,
        tag: "Aplicativo Mobile",
        title: "Time Mark - Imagens e Vídeos",
        url: "https://play.google.com/store/apps/details?id=com.oceangalaxy.camera.new&hl=pt_BR",
        icon: "https://i.postimg.cc/05GN3pw1/Gemini-Generated-Image-6laabv6laabv6laa.png"
      }
    ];

    function getData() {
      const savedData = localStorage.getItem('guardiao_platforms');
      return savedData ? JSON.parse(savedData) : defaultData;
    }

    function getLogo() {
      return localStorage.getItem('guardiao_logo') || defaultLogo;
    }

    function renderApp() {
      document.getElementById('main-logo').src = getLogo();

      const data = getData();
      const container = document.getElementById('buttons-container');
      container.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('a');
        card.href = item.url;
        card.target = "_blank";
        card.className = 'system-card';
        card.innerHTML = `
          <div class="card-banner">
            <div class="status-badge">
              <div class="status-dot"></div>
              Acesso
            </div>
            <img src="${item.icon}" alt="${item.title}">
          </div>
          <div class="card-body">
            <span class="card-tag">${item.tag || "Plataforma"}</span>
            <span class="card-title">${item.title}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openAdmin() {
      const password = prompt("Senha de acesso:");
      if (password === "admin123") {
        buildAdminForm();
        document.getElementById('admin-modal').style.display = 'flex';
      } else if (password !== null) {
        alert("Senha incorreta!");
      }
    }

    function closeAdmin() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    function buildAdminForm() {
      document.getElementById('logo-url-input').value = getLogo();
      const data = getData();
      const container = document.getElementById('inputs-container');
      container.innerHTML = '';

      data.forEach((item, index) => {
        const group = document.createElement('div');
        group.className = 'form-group';
        group.innerHTML = `
          <label>Card ${index + 1}</label>
          <input type="text" id="tag-${item.id}" value="${item.tag || 'Plataforma'}" placeholder="Categoria/Tag">
          <input type="text" id="title-${item.id}" value="${item.title}" placeholder="Nome do Sistema" required>
          <input type="url" id="url-${item.id}" value="${item.url}" placeholder="Link de Acesso (https://...)" required>
          <input type="url" id="icon-${item.id}" value="${item.icon}" placeholder="Link da Imagem/Logo" required>
        `;
        container.appendChild(group);
      });
    }

    document.getElementById('admin-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newLogo = document.getElementById('logo-url-input').value;
      localStorage.setItem('guardiao_logo', newLogo);

      const data = getData();
      const updatedData = data.map(item => ({
        id: item.id,
        tag: document.getElementById(`tag-${item.id}`).value,
        title: document.getElementById(`title-${item.id}`).value,
        url: document.getElementById(`url-${item.id}`).value,
        icon: document.getElementById(`icon-${item.id}`).value
      }));

      localStorage.setItem('guardiao_platforms', JSON.stringify(updatedData));
      renderApp();
      closeAdmin();
      alert("Configurações atualizadas!");
    });

    renderApp();
  </script>
</body>
</html>
