<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Guardião - Serviços de Qualidade</title>

  <!-- PWA / Mobile Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guardião">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="description" content="Central de sistemas da Guardião - Serviços de Qualidade">
  <meta name="author" content="Wendel Emílio de Souza Matias - oficial.respostas@gmail.com">

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0a0a0c;
      --card-bg: rgba(22, 22, 26, 0.85);
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-gradient: linear-gradient(135deg, #f7e7ad 0%, #c5a059 50%, #8a6d2b 100%);
      --border-card: rgba(212, 175, 55, 0.3);
      --border-hover: rgba(212, 175, 55, 0.9);
      --text-white: #ffffff;
      --text-muted: #9a9a9e;
      --green-status: #00e676;
      --red-status: #ff5252;
      --panel: #121215;
      --field: #0a0a0c;
      --field-border: #2a2a2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-main);
      background-image:
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
      background-attachment: fixed;
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    button { font-family: inherit; }

    /* ---------- Barra superior ---------- */
    .top-bar {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .top-bar > * { pointer-events: auto; }

    .net-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .net-status .status-dot { width: 7px; height: 7px; }
    .net-status.offline .status-dot { background: var(--red-status); box-shadow: 0 0 8px var(--red-status); }
    .net-status.offline { color: var(--red-status); border-color: rgba(255, 82, 82, 0.35); }

    .admin-btn {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-card);
      color: var(--gold-primary);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .admin-btn:active {
      transform: rotate(90deg) scale(0.9);
      border-color: var(--gold-primary);
    }

    /* ---------- Topo / Logo ---------- */
    header {
      text-align: center;
      margin-top: 40px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeInDown 0.8s ease-out;
    }

    .logo-container {
      width: 100%;
      max-width: 230px;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      border-radius: 18px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.9));
    }

    .greeting {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .greeting strong {
      font-size: 1.05rem;
      font-weight: 700;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .greeting span {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ---------- Lista de Cards ---------- */
    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 24px 0;
    }

    .system-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      text-decoration: none;
      color: var(--text-white);
      border: 1px solid var(--border-card);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), border-color 0.3s, box-shadow 0.3s;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .system-card:active {
      transform: scale(0.97);
      border-color: var(--border-hover);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.25);
    }

    @media (hover: hover) {
      .system-card:hover {
        border-color: var(--border-hover);
        transform: translateY(-3px);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.2);
      }
      .system-card:hover .card-arrow { transform: translateX(4px); }
    }

    .system-card:focus-visible {
      outline: 2px solid var(--gold-primary);
      outline-offset: 3px;
    }

    .card-banner {
      width: 100%;
      height: 160px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px;
    }

    .card-banner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    .system-card:active .card-banner img { transform: scale(1.03); }

    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 2;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--green-status);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-status);
      flex-shrink: 0;
    }

    .card-body {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01) 0%, rgba(255, 255, 255, 0.03) 100%);
    }

    .card-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .card-tag {
      font-size: 0.65rem;
      color: var(--gold-primary);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .card-arrow {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-primary);
      font-weight: 700;
      transition: transform 0.3s ease;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 40px 20px;
      border: 1px dashed var(--border-card);
      border-radius: 20px;
      line-height: 1.5;
    }

    /* ---------- Rodapé ---------- */
    footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 5px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    footer a {
      color: var(--gold-primary);
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    footer a:hover {
      color: var(--gold-light);
      text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
    }

    .dev-credit {
      font-size: 0.58rem;
      letter-spacing: 0.4px;
      text-transform: none;
      font-weight: 500;
      color: #5f5f64;
    }

    .dev-credit a { color: #7d7d82; }

    /* ---------- Painel Admin (gaveta) ---------- */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
    }

    .modal.aberto { display: flex; }

    .modal-content {
      background: var(--panel);
      border: 1px solid var(--border-card);
      border-bottom: none;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 24px 20px max(24px, env(safe-area-inset-bottom));
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      color: var(--text-white);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overscroll-behavior: contain;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      position: sticky;
      top: -24px;
      background: var(--panel);
      z-index: 2;
      padding-top: 4px;
    }

    .modal-header h2 {
      color: var(--gold-primary);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-white);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .section-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin: 22px 0 10px;
    }

    .form-group {
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px;
      border-radius: 14px;
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .group-head label {
      font-size: 0.75rem;
      color: var(--gold-primary);
      font-weight: 700;
      text-transform: uppercase;
    }

    .group-actions { display: flex; gap: 6px; }

    .mini-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--field-border);
      background: var(--field);
      color: var(--text-white);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-btn:disabled { opacity: 0.3; cursor: default; }
    .mini-btn.perigo { color: var(--red-status); border-color: rgba(255, 82, 82, 0.35); }

    .field-label {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 600;
      margin: 8px 0 5px;
    }

    .form-group input[type="text"],
    .form-group input[type="url"],
    .dlg input {
      width: 100%;
      padding: 12px;
      background: var(--field);
      border: 1px solid var(--field-border);
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .form-group input:focus, .dlg input:focus { border-color: var(--gold-primary); }
    .form-group input.invalido { border-color: var(--red-status); }

    .img-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .img-row input { flex: 1; min-width: 0; }

    .upload-btn {
      flex-shrink: 0;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-primary);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .preview {
      margin-top: 10px;
      height: 90px;
      border-radius: 10px;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .add-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px dashed var(--border-card);
      background: transparent;
      color: var(--gold-primary);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .save-btn, .btn-ouro {
      width: 100%;
      background: var(--gold-gradient);
      color: #000;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }

    .save-btn {
      margin-top: 16px;
      position: sticky;
      bottom: 0;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tool-btn {
      padding: 13px 10px;
      border-radius: 12px;
      border: 1px solid var(--field-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-white);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
    }

    .tool-btn.perigo { color: var(--red-status); border-color: rgba(255, 82, 82, 0.3); }

    .aviso {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.15);
    }

    /* ---------- Caixas de diálogo ---------- */
    .dlg-fundo {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 2000;
      animation: fadeIn 0.2s ease;
    }

    .dlg {
      width: 100%;
      max-width: 340px;
      background: var(--panel);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dlg h3 {
      color: var(--gold-primary);
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .dlg p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .dlg input { margin-bottom: 14px; }

    .dlg-botoes {
      display: flex;
      gap: 10px;
    }

    .dlg-botoes button { flex: 1; padding: 13px; font-size: 0.85rem; }

    .btn-sec {
      border-radius: 12px;
      border: 1px solid var(--field-border);
      background: transparent;
      color: var(--text-white);
      font-weight: 700;
      cursor: pointer;
    }

    .btn-perigo {
      border-radius: 12px;
      border: none;
      background: var(--red-status);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }

    /* ---------- Avisos rápidos ---------- */
    .toast-area {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 3000;
      width: calc(100% - 32px);
      max-width: 380px;
      pointer-events: none;
    }

    .toast {
      background: #1a1a1f;
      border: 1px solid var(--border-card);
      color: var(--text-white);
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      animation: toastIn 0.3s ease;
      text-align: center;
    }

    .toast.ok { border-color: rgba(0, 230, 118, 0.5); }
    .toast.erro { border-color: rgba(255, 82, 82, 0.6); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      .system-card { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="net-status" id="net-status">
      <div class="status-dot"></div>
      <span id="net-texto">Online</span>
    </div>
    <button class="admin-btn" id="admin-btn" type="button" title="Painel Admin" aria-label="Abrir painel administrativo">⚙️</button>
  </div>

  <header>
    <div class="logo-container">
      <img id="main-logo" alt="Guardião">
    </div>
    <div class="greeting">
      <strong id="saudacao">Bem-vindo</strong>
      <span id="data-hora"></span>
    </div>
  </header>

  <main class="app-container" id="buttons-container"></main>

  <footer>
    <a href="https://guardiaoseg.com.br/" target="_blank" rel="noopener">Guardião &copy; Serviços de Qualidade</a>
    <span class="dev-credit">Desenvolvido por Wendel Emílio de Souza Matias · <a href="mailto:oficial.respostas@gmail.com">oficial.respostas@gmail.com</a></span>
  </footer>

  <!-- Painel Admin -->
  <div class="modal" id="admin-modal" role="dialog" aria-modal="true" aria-labelledby="admin-titulo">
    <div class="modal-content" id="admin-conteudo">
      <div class="modal-header">
        <h2 id="admin-titulo">Painel Administrativo</h2>
        <button class="close-btn" id="fechar-admin" type="button" aria-label="Fechar">✕</button>
      </div>
      <div id="admin-corpo"></div>
    </div>
  </div>

  <div class="toast-area" id="toast-area" aria-live="polite"></div>

  <script>
    'use strict';

    /* =========================================================
       CONFIGURAÇÃO PADRÃO
       Para mudar os sistemas para TODOS os aparelhos de uma vez,
       altere a lista abaixo e publique o arquivo de novo.

    function el(tag, attrs, ...filhos) {
      const e = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (v === undefined || v === null) continue;
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k === 'value') e.value = v;
          else if (k === 'disabled') e.disabled = !!v;
          else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        }
      }
      filhos.forEach((f) => {
        if (f === null || f === undefined) return;
        e.appendChild(typeof f === 'string' ? document.createTextNode(f) : f);
      });
      return e;
    }

    function clonar(o) { return JSON.parse(JSON.stringify(o)); }

    function lerTexto(chave) {
      try { return localStorage.getItem(chave); } catch (e) { return null; }
    }

    function gravar(chave, valor) {
      try {
        localStorage.setItem(chave, typeof valor === 'string' ? valor : JSON.stringify(valor));
        return true;
      } catch (e) {
        toast('Sem espaço no aparelho para salvar. Use imagens menores ou links.', 'erro');
        return false;
      }
    }

    function apagar(chave) {
      try { localStorage.removeItem(chave); } catch (e) { /* sem acesso */ }
    }

    function novoId() { return Date.now() + Math.floor(Math.random() * 1000); }

    function normalizarCards(lista) {
      if (!Array.isArray(lista)) return null;
      return lista
        .filter((x) => x && typeof x === 'object')
        .map((x, i) => ({
          id: x.id || novoId() + i,
          tag: String(x.tag || 'Plataforma'),
          title: String(x.title || ''),
          url: String(x.url || ''),
          icon: String(x.icon || '')
        }));
    }

    function getData() {
      const bruto = lerTexto(CHAVES.dados);
      if (!bruto) return clonar(DADOS_PADRAO);
      try {
        return normalizarCards(JSON.parse(bruto)) || clonar(DADOS_PADRAO);
      } catch (e) {
        return clonar(DADOS_PADRAO);
      }
    }

    function getLogo() { return lerTexto(CHAVES.logo) || LOGO_PADRAO; }

    function linkValido(u) {
      const t = String(u || '').trim();
      if (!t) return false;
      if (/^(javascript|data|vbscript):/i.test(t)) return false;
      if (/^https?:\/\//i.test(t)) return true;
      // Permite links internos do próprio site (ex.: pagina.html)
      return !/^[a-z][a-z0-9+.-]*:/i.test(t);
    }

    function imagemValida(u) {
      const t = String(u || '').trim();
      if (!t) return false;
      if (/^data:image\//i.test(t)) return true;
      if (/^(javascript|vbscript):/i.test(t)) return false;
      return true;
    }

    function rolarAte(alvo) {
      try { if (alvo && alvo.scrollIntoView) alvo.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { /* sem suporte */ }
    }

    function vibrar(ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* sem suporte */ }
    }

    /* ---------- Avisos rápidos ---------- */
    function toast(msg, tipo) {
      const t = el('div', { class: 'toast ' + (tipo || ''), text: msg });
      $('toast-area').appendChild(t);
      setTimeout(() => {
        t.style.transition = 'opacity 0.3s';
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 300);
      }, 2800);
    }

    /* ---------- Caixa de diálogo própria ---------- */
    function dialogo(opts) {
      return new Promise((resolve) => {
        const fundo = el('div', { class: 'dlg-fundo' });
        const caixa = el('div', { class: 'dlg', role: 'alertdialog', 'aria-modal': 'true' });
        caixa.appendChild(el('h3', { text: opts.titulo || '' }));
        if (opts.texto) caixa.appendChild(el('p', { text: opts.texto }));

        let campo = null;
        if (opts.campo) {
          campo = el('input', {
            type: opts.campo.tipo || 'text',
            placeholder: opts.campo.placeholder || '',
            autocomplete: 'off'
          });
          caixa.appendChild(campo);
        }

        let tecla = null;
        const fechar = (valor) => {
          document.removeEventListener('keydown', tecla);
          fundo.remove();
          resolve(valor);
        };

        const linha = el('div', { class: 'dlg-botoes' });
        if (opts.semCancelar !== true) {
          linha.appendChild(el('button', {
            type: 'button', class: 'btn-sec', text: opts.cancelar || 'Cancelar',
            onclick: () => fechar(null)
          }));
        }
        const ok = el('button', {
          type: 'button', class: opts.perigo ? 'btn-perigo' : 'btn-ouro', text: opts.ok || 'OK',
          onclick: () => fechar(campo ? campo.value : true)
        });
        linha.appendChild(ok);
        caixa.appendChild(linha);
        fundo.appendChild(caixa);

        fundo.addEventListener('click', (e) => { if (e.target === fundo) fechar(null); });
        tecla = (e) => {
          if (e.key === 'Escape') { e.stopPropagation(); fechar(null); }
          else if (e.key === 'Enter' && campo) { e.preventDefault(); ok.click(); }
        };
        document.addEventListener('keydown', tecla);
        document.body.appendChild(fundo);
        setTimeout(() => (campo || ok).focus(), 60);
      });
    }

    /* ---------- Senha ---------- */
    async function gerarHash(texto) {
      if (window.crypto && crypto.subtle && window.TextEncoder) {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
          return 's:' + Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        } catch (e) { /* segue para o modo simples */ }
      }
      let h = 5381;
      for (let i = 0; i < texto.length; i++) h = ((h << 5) + h + texto.charCodeAt(i)) | 0;
      return 'd:' + (h >>> 0).toString(16);
    }

    async function senhaConfere(texto) {
      const salva = lerTexto(CHAVES.senha);
      if (!salva) return texto === SENHA_PADRAO;
      return (await gerarHash(texto)) === salva;
    }

    /* ---------- Tela principal ---------- */
    function aplicarLogo(img, src) {
      img.onerror = () => { img.onerror = null; img.src = LOGO_RESERVA; };
      img.src = src || LOGO_RESERVA;
    }

    function aplicarImagem(img, src) {
      img.onerror = () => { img.onerror = null; img.src = IMG_RESERVA; };
      img.src = imagemValida(src) ? src : IMG_RESERVA;
    }

    function renderApp() {
      aplicarLogo($('main-logo'), getLogo());

      const cont = $('buttons-container');
      cont.replaceChildren();
      const dados = getData();

      if (!dados.length) {
        cont.appendChild(el('div', {
          class: 'empty-state',
          text: 'Nenhum sistema cadastrado ainda. Toque na engrenagem ⚙️ para adicionar.'
        }));
        return;
      }

      dados.forEach((item, i) => {
        const img = el('img', { alt: item.title, loading: 'lazy', decoding: 'async' });
        aplicarImagem(img, item.icon);

        const card = el('a', {
          class: 'system-card',
          href: linkValido(item.url) ? item.url.trim() : '#',
          target: '_blank',
          rel: 'noopener noreferrer',
          style: 'animation-delay:' + (i * 0.08) + 's'
        },
          el('div', { class: 'card-banner' },
            el('div', { class: 'status-badge' }, el('div', { class: 'status-dot' }), 'Acesso'),
            img
          ),
          el('div', { class: 'card-body' },
            el('div', { class: 'card-text' },
              el('span', { class: 'card-tag', text: item.tag || 'Plataforma' }),
              el('span', { class: 'card-title', text: item.title || 'Sem nome' })
            ),
            el('span', { class: 'card-arrow', 'aria-hidden': 'true', text: '→' })
          )
        );

        card.addEventListener('click', (e) => {
          if (!linkValido(item.url)) {
            e.preventDefault();
            toast('Este sistema está sem link de acesso.', 'erro');
            return;
          }
          vibrar(15);
        });

        cont.appendChild(card);
      });
    }

    function atualizarSaudacao() {
      const agora = new Date();
      const h = agora.getHours();
      $('saudacao').textContent = h < 12 ? 'Bom dia' : (h < 18 ? 'Boa tarde' : 'Boa noite');
      const data = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
      const hora = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      $('data-hora').textContent = data.charAt(0).toUpperCase() + data.slice(1) + ' · ' + hora;
    }

    function atualizarRede() {
      const online = navigator.onLine !== false;
      $('net-status').classList.toggle('offline', !online);
      $('net-texto').textContent = online ? 'Online' : 'Sem internet';
    }

    /* ---------- Painel administrativo ---------- */
    let rascunho = [];
    let logoRascunho = '';
    let alterado = false;
    let tentativas = 0;
    let bloqueadoAte = 0;

    function marcarAlterado() { alterado = true; }

    async function abrirAdmin() {
      if (Date.now() < bloqueadoAte) {
        const seg = Math.ceil((bloqueadoAte - Date.now()) / 1000);
        toast('Muitas tentativas erradas. Aguarde ' + seg + ' segundos.', 'erro');
        return;
      }
      const senha = await dialogo({
        titulo: 'Acesso restrito',
        texto: 'Digite a senha do painel administrativo.',
        campo: { tipo: 'password', placeholder: 'Senha' },
        ok: 'Entrar'
      });
      if (senha === null) return;

      if (await senhaConfere(senha)) {
        tentativas = 0;
        rascunho = getData();
        logoRascunho = getLogo();
        alterado = false;
        montarPainel();
        $('admin-modal').classList.add('aberto');
        document.body.style.overflow = 'hidden';
      } else {
        tentativas++;
        vibrar([60, 40, 60]);
        if (tentativas >= 5) {
          tentativas = 0;
          bloqueadoAte = Date.now() + 30000;
          toast('Senha incorreta 5 vezes. Painel bloqueado por 30 segundos.', 'erro');
        } else {
          toast('Senha incorreta.', 'erro');
        }
      }
    }

    function fecharDeVez() {
      $('admin-modal').classList.remove('aberto');
      document.body.style.overflow = '';
      alterado = false;
    }

    async function fecharAdmin() {
      if (alterado) {
        const sim = await dialogo({
          titulo: 'Sair sem salvar?',
          texto: 'Você fez alterações que ainda não foram salvas. Elas serão perdidas.',
          ok: 'Sair sem salvar',
          cancelar: 'Continuar editando',
          perigo: true
        });
        if (!sim) return;
      }
      fecharDeVez();
    }

    function reduzirImagem(arquivo, maxLado, formato) {
      return new Promise((resolve, reject) => {
        if (!arquivo || !/^image\//.test(arquivo.type)) {
          reject(new Error('tipo'));
          return;
        }
        const leitor = new FileReader();
        leitor.onerror = () => reject(new Error('leitura'));
        leitor.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('imagem'));
          img.onload = () => {
            let w = img.naturalWidth || img.width;
            let h = img.naturalHeight || img.height;
            const escala = Math.min(1, maxLado / Math.max(w, h));
            w = Math.max(1, Math.round(w * escala));
            h = Math.max(1, Math.round(h * escala));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            if (formato === 'image/jpeg') {
              ctx.fillStyle = '#000';
              ctx.fillRect(0, 0, w, h);
            }
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL(formato, 0.82));
          };
          img.src = leitor.result;
        };
        leitor.readAsDataURL(arquivo);
      });
    }

    function campoImagem(rotulo, valorAtual, aoMudar, opcoesImg) {
      const ehArquivo = /^data:/i.test(valorAtual);
      const preview = el('img', { alt: 'Prévia' });
      if (opcoesImg.logo) aplicarLogo(preview, valorAtual); else aplicarImagem(preview, valorAtual);

      const entrada = el('input', {
        type: 'text',
        value: ehArquivo ? '' : valorAtual,
        placeholder: ehArquivo ? '✓ Imagem enviada do aparelho' : 'Link da imagem (https://...)',
        autocomplete: 'off',
        spellcheck: 'false'
      });

      const seletor = el('input', { type: 'file', accept: 'image/*', style: 'display:none' });

      entrada.addEventListener('input', () => {
        const v = entrada.value.trim();
        if (v) {
          aoMudar(v);
          if (opcoesImg.logo) aplicarLogo(preview, v); else aplicarImagem(preview, v);
        }
        marcarAlterado();
      });

      seletor.addEventListener('change', async () => {
        const arq = seletor.files && seletor.files[0];
        seletor.value = '';
        if (!arq) return;
        try {
          const dataUrl = await reduzirImagem(arq, opcoesImg.max, opcoesImg.formato);
          aoMudar(dataUrl);
          entrada.value = '';
          entrada.placeholder = '✓ Imagem enviada do aparelho';
          if (opcoesImg.logo) aplicarLogo(preview, dataUrl); else aplicarImagem(preview, dataUrl);
          marcarAlterado();
          toast('Imagem carregada. Lembre de salvar.', 'ok');
        } catch (e) {
          toast('Não consegui abrir essa imagem. Tente outra.', 'erro');
        }
      });

      return el('div', null,
        el('span', { class: 'field-label', text: rotulo }),
        el('div', { class: 'img-row' },
          entrada,
          el('button', { type: 'button', class: 'upload-btn', text: '📷 Enviar', onclick: () => seletor.click() }),
          seletor
        ),
        el('div', { class: 'preview' }, preview)
      );
    }

    function campoTexto(rotulo, valor, placeholder, aoMudar, tipo) {
      const entrada = el('input', {
        type: tipo || 'text',
        value: valor,
        placeholder: placeholder,
        autocomplete: 'off',
        spellcheck: tipo === 'url' ? 'false' : 'true'
      });
      entrada.addEventListener('input', () => {
        entrada.classList.remove('invalido');
        aoMudar(entrada.value);
        marcarAlterado();
      });
      return { bloco: el('div', null, el('span', { class: 'field-label', text: rotulo }), entrada), entrada };
    }

    function moverCard(i, direcao) {
      const j = i + direcao;
      if (j < 0 || j >= rascunho.length) return;
      const tmp = rascunho[i];
      rascunho[i] = rascunho[j];
      rascunho[j] = tmp;
      marcarAlterado();
      montarPainel();
    }

    async function removerCard(i) {
      const nome = rascunho[i].title || 'este sistema';
      const sim = await dialogo({
        titulo: 'Remover sistema?',
        texto: 'O card "' + nome + '" será removido da tela inicial.',
        ok: 'Remover',
        perigo: true
      });
      if (!sim) return;
      rascunho.splice(i, 1);
      marcarAlterado();
      montarPainel();
    }

    function adicionarCard() {
      rascunho.push({ id: novoId(), tag: 'Plataforma', title: '', url: '', icon: '' });
      marcarAlterado();
      montarPainel();
      const corpo = $('admin-conteudo');
      setTimeout(() => {
        const grupos = corpo.querySelectorAll('.card-grupo');
        const ultimo = grupos[grupos.length - 1];
        if (ultimo) {
          rolarAte(ultimo);
          const primeiro = ultimo.querySelectorAll('input[type="text"]')[1];
          if (primeiro) primeiro.focus();
        }
      }, 80);
    }

    const camposValidacao = [];

    function montarPainel() {
      const corpo = $('admin-corpo');
      corpo.replaceChildren();
      camposValidacao.length = 0;

      // Logo
      corpo.appendChild(el('div', { class: 'section-title', text: 'Logo principal' }));
      corpo.appendChild(el('div', { class: 'form-group' },
        campoImagem('Imagem da logo', logoRascunho, (v) => { logoRascunho = v; }, { logo: true, max: 460, formato: 'image/png' })
      ));

      // Cards
      corpo.appendChild(el('div', { class: 'section-title', text: 'Sistemas na tela inicial (' + rascunho.length + ')' }));

      rascunho.forEach((item, i) => {
        const nome = campoTexto('Nome do sistema', item.title, 'Ex.: APP - Guardião Relatórios', (v) => { item.title = v; });
        const link = campoTexto('Link de acesso', item.url, 'https://...', (v) => { item.url = v; }, 'url');
        camposValidacao.push({ item, nome: nome.entrada, link: link.entrada });

        corpo.appendChild(el('div', { class: 'form-group card-grupo' },
          el('div', { class: 'group-head' },
            el('label', { text: 'Card ' + (i + 1) }),
            el('div', { class: 'group-actions' },
              el('button', { type: 'button', class: 'mini-btn', title: 'Subir', 'aria-label': 'Subir', text: '↑', disabled: i === 0, onclick: () => moverCard(i, -1) }),
              el('button', { type: 'button', class: 'mini-btn', title: 'Descer', 'aria-label': 'Descer', text: '↓', disabled: i === rascunho.length - 1, onclick: () => moverCard(i, 1) }),
              el('button', { type: 'button', class: 'mini-btn perigo', title: 'Remover', 'aria-label': 'Remover', text: '🗑', onclick: () => removerCard(i) })
            )
          ),
          campoTexto('Categoria', item.tag, 'Ex.: Plataforma', (v) => { item.tag = v; }).bloco,
          nome.bloco,
          link.bloco,
          campoImagem('Imagem do card', item.icon, (v) => { item.icon = v; }, { logo: false, max: 640, formato: 'image/jpeg' })
        ));
      });

      corpo.appendChild(el('button', { type: 'button', class: 'add-btn', text: '+ Adicionar sistema', onclick: adicionarCard }));

      // Ferramentas
      corpo.appendChild(el('div', { class: 'section-title', text: 'Mais opções' }));
      corpo.appendChild(el('div', { class: 'tools-grid' },
        el('button', { type: 'button', class: 'tool-btn', text: '🔑 Trocar senha', onclick: trocarSenha }),
        el('button', { type: 'button', class: 'tool-btn', text: '📤 Exportar configuração', onclick: exportarConfig }),
        el('button', { type: 'button', class: 'tool-btn', text: '📥 Importar configuração', onclick: importarConfig }),
        el('button', { type: 'button', class: 'tool-btn perigo', text: '↺ Restaurar padrão', onclick: restaurarPadrao })
      ));

      corpo.appendChild(el('div', {
        class: 'aviso',
        text: 'Atenção: as alterações feitas aqui valem só para este aparelho. Para levar a mesma configuração para outro celular, use "Exportar" aqui e "Importar" no outro.'
      }));

      corpo.appendChild(el('button', { type: 'button', class: 'save-btn', text: 'SALVAR ALTERAÇÕES', onclick: salvarAlteracoes }));
    }

    function salvarAlteracoes() {
      for (const c of camposValidacao) {
        if (!c.item.title.trim()) {
          c.nome.classList.add('invalido');
          rolarAte(c.nome);
          c.nome.focus();
          toast('Preencha o nome do sistema.', 'erro');
          return;
        }
        if (!linkValido(c.item.url)) {
          c.link.classList.add('invalido');
          rolarAte(c.link);
          c.link.focus();
          toast('Link inválido. Use um endereço começando com https://', 'erro');
          return;
        }
      }

      const limpos = rascunho.map((x) => ({
        id: x.id,
        tag: (x.tag || '').trim() || 'Plataforma',
        title: x.title.trim(),
        url: x.url.trim(),
        icon: (x.icon || '').trim()
      }));

      const okDados = gravar(CHAVES.dados, limpos);
      if (!okDados) return;
      const okLogo = gravar(CHAVES.logo, (logoRascunho || '').trim() || LOGO_PADRAO);
      if (!okLogo) return;

      renderApp();
      fecharDeVez();
      vibrar(25);
      toast('Alterações salvas!', 'ok');
    }

    async function trocarSenha() {
      const nova = await dialogo({
        titulo: 'Nova senha',
        texto: 'Mínimo de 4 caracteres. Guarde bem: sem ela não dá para abrir o painel neste aparelho.',
        campo: { tipo: 'password', placeholder: 'Nova senha' },
        ok: 'Continuar'
      });
      if (nova === null) return;
      if (nova.length < 4) { toast('A senha precisa ter pelo menos 4 caracteres.', 'erro'); return; }

      const repetir = await dialogo({
        titulo: 'Confirme a senha',
        campo: { tipo: 'password', placeholder: 'Digite de novo' },
        ok: 'Salvar senha'
      });
      if (repetir === null) return;
      if (repetir !== nova) { toast('As senhas não são iguais.', 'erro'); return; }

      if (gravar(CHAVES.senha, await gerarHash(nova))) toast('Senha alterada!', 'ok');
    }

    function exportarConfig() {
      const pacote = {
        sistema: 'guardiao-central',
        versao: 1,
        exportadoEm: new Date().toISOString(),
        logo: logoRascunho,
        cards: rascunho
      };
      const blob = new Blob([JSON.stringify(pacote, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = el('a', { href: url, download: 'guardiao-configuracao.json' });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      toast('Arquivo de configuração baixado.', 'ok');
    }

    function importarConfig() {
      const seletor = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
      seletor.addEventListener('change', () => {
        const arq = seletor.files && seletor.files[0];
        seletor.remove();
        if (!arq) return;
        const leitor = new FileReader();
        leitor.onerror = () => toast('Não consegui ler o arquivo.', 'erro');
        leitor.onload = () => {
          try {
            const pacote = JSON.parse(leitor.result);
            const cards = normalizarCards(pacote && pacote.cards);
            if (!cards) throw new Error('formato');
            rascunho = cards;
            if (pacote.logo && typeof pacote.logo === 'string') logoRascunho = pacote.logo;
            marcarAlterado();
            montarPainel();
            toast('Configuração importada. Toque em SALVAR para aplicar.', 'ok');
          } catch (e) {
            toast('Arquivo inválido. Use um arquivo exportado por este painel.', 'erro');
          }
        };
        leitor.readAsText(arq);
      });
      document.body.appendChild(seletor);
      seletor.click();
    }

    async function restaurarPadrao() {
      const sim = await dialogo({
        titulo: 'Restaurar padrão?',
        texto: 'A logo e os sistemas voltam a ser os originais. A senha não muda. Você ainda precisa tocar em SALVAR.',
        ok: 'Restaurar',
        perigo: true
      });
      if (!sim) return;
      rascunho = clonar(DADOS_PADRAO);
      logoRascunho = LOGO_PADRAO;
      marcarAlterado();
      montarPainel();
      toast('Padrão restaurado. Toque em SALVAR para aplicar.', 'ok');
    }

    /* ---------- Início ---------- */
    $('admin-btn').addEventListener('click', abrirAdmin);
    $('fechar-admin').addEventListener('click', fecharAdmin);
    $('admin-modal').addEventListener('click', (e) => { if (e.target === $('admin-modal')) fecharAdmin(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('admin-modal').classList.contains('aberto') && !document.querySelector('.dlg-fundo')) {
        fecharAdmin();
      }
    });

    window.addEventListener('online', atualizarRede);
    window.addEventListener('offline', atualizarRede);
    window.addEventListener('storage', (e) => {
      if (e.key === CHAVES.dados || e.key === CHAVES.logo) renderApp();
    });

    renderApp();
    atualizarSaudacao();
    atualizarRede();
    setInterval(atualizarSaudacao, 30000);
  </script>
</body>
</html>
